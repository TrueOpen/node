# Builds the platform binaries for a release tag and attaches them, with a
# SHA256SUMS.txt, to a DRAFT release for the maintainer to review and publish.
#
# This implements steps 3-5 of "Producing a release" in
# docs/runbooks/release_artifacts.md. The artifact names and the checksum file
# are the ones that runbook tells validators to expect, so changing them here
# means changing it there too.
#
# It replaces the Ignite scaffold workflow, which ran `ignite chain build
# --release` on every push. That contradicted the runbook in three ways: it
# fired on pushes rather than tags, it deleted and recreated a "latest" tag
# (the runbook states a pushed tag is never deleted), and it published
# automatically instead of leaving a draft for the maintainer. It had also been
# failing since the repository was created, because the pinned-to-@main Ignite
# action dropped the --release flag.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      # CGO_ENABLED=0 is what makes cross-compiling darwin from this runner
      # work at all, and it is what the Dockerfile already does; the ldflags
      # match Makefile and Dockerfile so `noded version` agrees across all
      # three ways of building it.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA}"
          mkdir -p dist
          go build \
            -mod=readonly \
            -trimpath \
            -ldflags "-s -w \
              -X github.com/cosmos/cosmos-sdk/version.Name=node \
              -X github.com/cosmos/cosmos-sdk/version.AppName=noded \
              -X github.com/cosmos/cosmos-sdk/version.Version=${VERSION} \
              -X github.com/cosmos/cosmos-sdk/version.Commit=${COMMIT}" \
            -o dist/noded \
            ./cmd/noded
          tar -czf "noded-${VERSION}-${GOOS}-${GOARCH}.tar.gz" -C dist noded
          rm -rf dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: noded-${{ matrix.goos }}-${{ matrix.goarch }}
          path: noded-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # One SHA256SUMS.txt over every tarball, which is the file the runbook
      # tells the maintainer to detach-sign and validators to verify against.
      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum noded-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Draft, never prerelease: the runbook has the maintainer review and
      # publish, and attach the detached signature, before validators see it.
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            artifacts/noded-*.tar.gz
            artifacts/SHA256SUMS.txt
