syntax = "proto3";
package hub.internal.v1;

option go_package = "github.com/TrueOpen/node/x/hub/internal/types";

// ModelStoreState mirrors the public model fields with a raw proposer address.
message ModelStoreState {
  bytes model_id = 1;
  bytes proposer_address = 2;
  int32 status = 3;
  reserved 4;
  reserved "active_profile_count";
  uint32 latest_profile_version = 5;
  int32 status_source = 6;
  uint64 registration_fee_paid = 7;
  uint64 created_height = 8;
  uint64 updated_height = 9;
  uint64 active_support_stake = 10;
  uint32 active_supporter_count = 11;
  uint64 support_min_stake = 12;
  uint64 pending_support_min_stake = 13;
  uint64 pending_effective_height = 14;
  string provider = 15;
  string repo_id = 16;
}

// ProfileStoreState mirrors public profile tags with a raw proposer address.
message ProfileStoreState {
  bytes model_id = 1;
  uint32 profile_version = 2;
  bytes manifest_hash = 3;
  bytes tokenizer_hash = 4;
  string runtime_class = 5;
  uint32 required_top_k = 6;
  repeated int32 task_types = 7;
  int32 generation_type = 8;
  uint32 resource_tier = 9;
  uint64 min_stake = 10;
  uint64 challenge_open_window_blocks = 11;
  bytes verification_profile = 12;
  bytes verification_thresholds = 13;
  bytes batch_verification = 14;
  bytes pricing_profile = 15;
  bytes timeout_bootstrap_profile = 16;
  bytes schema_hash = 17;
  int32 status = 18;
  int32 status_source = 22;
  uint64 registration_fee_paid = 23;
  uint32 previous_profile_version = 24;
  bytes proposer_address = 25;
  bytes registration_digest = 26;
  uint64 created_height = 27;
  uint64 updated_height = 28;
  optional uint64 last_freeze_risk_window_evaluated = 29;
  uint64 ref_price = 30;
  bytes source = 31;
  bytes tool_call_parser = 32;
  bytes reasoning_parser = 33;
}

// ModelCapabilityStoreState retains the operator as raw address bytes.
message ModelCapabilityStoreState {
  bytes operator_address = 1;
  bytes model_id = 2;
  bool inference_capability = 4;
  bool verification_capability = 5;
  uint64 capability_version = 6;
}

// ModelSupportStoreState retains the operator as raw address bytes.
message ModelSupportStoreState {
  bytes operator_address = 1;
  bytes model_id = 2;
  bool declared_support = 4;
  bool support_active = 5;
  int32 activation_kind = 6;
  int32 first_activation_duty = 7;
  bytes first_support_task_id = 8;
  uint64 first_support_order_value = 9;
  oneof p30_source {
    uint64 p30_cutoff_epoch = 10;
    bool p30_bootstrap = 17;
  }
  uint64 support_fresh_until_epoch = 11;
  bytes last_refresh_task_id = 12;
  uint64 last_refresh_height = 13;
  uint64 active_support_stake_snapshot = 14;
  uint64 support_version = 16;
  uint32 first_support_profile_version = 18;
  int32 suspend_reason = 19;
}

// ModelSupportRecheckCursorStoreState stores its progress address as bytes.
message ModelSupportRecheckCursorStoreState {
  bytes model_id = 1;
  uint64 effective_height = 2;
  bytes last_operator_address = 3;
  uint64 visited_count = 4;
  uint64 suspended_count = 5;
  uint64 restored_count = 6;
  bool min_stake_lowered = 7;
}

// ModelSupportDeactivateCursorStoreState retains the resume address as raw bytes.
message ModelSupportDeactivateCursorStoreState {
  bytes model_id = 1;
  bytes last_operator_address = 2;
  uint64 visited_count = 3;
  uint64 deactivated_count = 4;
}

// DailySupportStoreState retains the operator as raw address bytes.
message DailySupportStoreState {
  uint64 epoch = 1;
  bytes operator_address = 2;
  bytes supported_models_hash = 3;
  bytes signature_digest = 4;
  uint64 accepted_height = 5;
}
