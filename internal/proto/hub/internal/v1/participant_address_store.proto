syntax = "proto3";
package hub.internal.v1;

option go_package = "github.com/TrueOpen/node/x/hub/internal/types";

// CortexNodeStoreState keeps account addresses in codec bytes.
message CortexNodeStoreState {
  uint32 schema_version = 1;
  bytes operator_address = 2;
  bytes current_service_address = 3;
  bytes current_service_pubkey = 4;
  uint64 service_authorization_nonce = 5;
  int32 service_key_status = 6;
  uint64 current_descriptor_version = 7;
  uint64 registered_height = 8;
  uint64 updated_height = 9;
  uint32 active_task_liability_count = 10;
  uint32 pending_stage_duty_count = 11;
  uint32 pending_evidence_submission_count = 12;
  bytes previous_service_pubkey = 13;
  uint64 previous_service_authorization_nonce = 14;
  uint64 previous_retired_height = 15;
}

// BuilderStoreState keeps account addresses in codec bytes.
message BuilderStoreState {
  uint32 schema_version = 1;
  bytes builder_address = 2;
  bytes current_service_address = 3;
  bytes current_service_pubkey = 4;
  int32 current_service_key_status = 5;
  uint64 service_authorization_nonce = 6;
  uint64 current_descriptor_version = 7;
  uint64 registered_height = 8;
  uint32 active_task_liability_count = 9;
  uint32 pending_stage_duty_count = 10;
  uint32 pending_evidence_submission_count = 11;
  bytes previous_service_pubkey = 12;
  uint64 previous_service_authorization_nonce = 13;
  uint64 previous_retired_height = 14;
}

// CurrentServiceAddressIndexStoreState stores the operator as codec bytes.
message CurrentServiceAddressIndexStoreState {
  bytes operator_address = 1;
  uint64 service_authorization_nonce = 2;
}

// PendingServiceKeyRotationStoreState stores the operator as raw account bytes.
message PendingServiceKeyRotationStoreState {
  int32 participant_type = 1;
  bytes operator_address = 2;
  uint64 current_service_authorization_nonce = 3;
  bytes new_service_pubkey = 4;
  uint64 next_service_authorization_nonce = 5;
  uint64 registered_height = 6;
  uint64 effective_height = 7;
  reserved 8;
  reserved "old_material_close_height";
}

// PendingServiceAddressStoreState reserves a future address across both roles.
message PendingServiceAddressStoreState {
  int32 participant_type = 1;
  bytes operator_address = 2;
}
