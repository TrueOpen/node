syntax = "proto3";
package hub.internal.v1;

option go_package = "github.com/TrueOpen/node/x/hub/internal/types";

// VrfKeyStoreState retains the operator address as codec bytes.
message VrfKeyStoreState {
  bytes operator_address = 1;
  bytes active_vrf_pubkey = 2;
  uint64 active_from_epoch = 3;
  bytes pending_vrf_pubkey = 4;
  uint64 pending_from_epoch = 5;
  uint64 vrf_authorization_nonce = 6;
  uint64 registered_height = 7;
  bool has_pending_vrf_pubkey = 8;
  bool has_pending_from_epoch = 9;
}

// VrfKeyHistoryStoreState retains the operator address as codec bytes.
message VrfKeyHistoryStoreState {
  bytes operator_address = 1;
  uint64 effective_from_epoch = 2;
  bytes vrf_pubkey = 3;
  uint64 retired_at_epoch = 4;
}
