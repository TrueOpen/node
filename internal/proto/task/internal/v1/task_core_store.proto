syntax = "proto3";
package task.internal.v1;

option go_package = "github.com/TrueOpen/node/x/task/internal/types";

// TaskCoreStoreState mirrors public field tags with a raw user address.
message TaskCoreStoreState {
  bytes task_id = 1;
  bytes user_address = 2;
  bytes session_id = 3;
  uint64 order_sequence = 4;
  bytes accepted_task_hash = 5;
  bytes accepted_input_hash = 6;
  bytes accepted_order_opening_hash = 7;
  bytes model_id = 8;
  uint32 profile_version = 9;
  int32 task_type = 10;
  bytes order_value = 11;
  int32 task_phase = 12;
  int32 assignment_status = 13;
  int32 receipt_status = 14;
  int32 verification_status = 15;
  int32 settlement_status = 16;
  int32 finality_status = 17;
  uint32 effective_verify_round = 18;
  optional uint64 task_finality_height = 19;
  uint64 created_height = 20;
  uint64 updated_height = 21;
  uint64 evidence_retention_blocks_snapshot = 22;
  uint32 objective_forgery_slash_bps_snapshot = 23;
  int32 accepted_payload_mode = 24;
}
