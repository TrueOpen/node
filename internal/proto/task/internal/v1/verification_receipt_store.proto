syntax = "proto3";
package task.internal.v1;

option go_package = "github.com/TrueOpen/node/x/task/internal/types";

// CommitStoreState stores the verifier operator as codec bytes.
message CommitStoreState {
  bytes commit_key = 1;
  bytes task_id = 2;
  uint32 verify_round = 3;
  bytes verifier_operator_address = 4;
  bytes commit_hash = 5;
  bytes commit_signing_digest = 6;
  bytes signature_digest = 7;
  uint64 commit_height = 8;
  int32 status = 9;
}

// MetricSummaryStoreState preserves public optional metric presence.
message MetricSummaryStoreState {
  uint32 finite_count = 1;
  uint32 missing_compared_count = 2;
  uint32 mean_abs_logprob_diff_fp_1e6 = 3;
  uint32 abs_logprob_diff_p95_fp_1e6 = 4;
  uint32 abs_logprob_diff_p99_fp_1e6 = 5;
  uint32 rank_delta_nonzero_rate_fp_1e6 = 6;
  bool has_topk_jaccard_mean_fp_1e6 = 7;
  uint32 topk_jaccard_mean_fp_1e6 = 8;
  bool has_union_js_p99_fp_1e6 = 9;
  uint32 union_js_p99_fp_1e6 = 10;
  uint32 compared_topk_count = 11;
  uint32 compared_rank_count = 12;
}

// ResultReceiptStoreState stores the verifier operator as codec bytes.
message ResultReceiptStoreState {
  bytes commit_key = 1;
  bytes task_id = 2;
  uint32 verify_round = 3;
  bytes verifier_operator_address = 4;
  uint32 selected_verifier_index = 5;
  bytes metric_root = 6;
  MetricSummaryStoreState metric_summary = 7;
  bytes metric_summary_hash = 8;
  bytes aggregate_proof_hash = 9;
  bytes verifier_evidence_bundle_hash = 10;
  uint64 verifier_evidence_manifest_size_bytes = 11;
  bytes salt = 12;
  bytes result_payload_hash = 13;
  bytes result_receipt_signing_digest = 14;
  bytes signature_digest = 15;
  uint64 accepted_height = 16;
}
