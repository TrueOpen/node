syntax = "proto3";
package task.internal.v1;

option go_package = "github.com/TrueOpen/node/x/task/internal/types";

// TaskBuilderSelectionStoreState stores selected Builder addresses as codec bytes.
message TaskBuilderSelectionStoreState {
  bytes task_id = 1;
  bytes session_anchor_block_hash = 2;
  string builder_set_id = 3;
  bytes builder_set_hash = 4;
  repeated bytes selected_task_builders = 5;
  uint32 selected_task_builder_count = 6;
  bytes selected_task_builders_hash = 7;
  uint64 created_height = 8;
  int32 body_status = 9;
  bool builder_set_ref_released = 10;
  uint32 builder_fault_slash_bps_snapshot = 11;
}
